plugins {
    id 'com.android.application'
}

apply from: rootProject.file('gradle/elf-dependencies.gradle')

def releaseSigningFile = rootProject.file(providers.gradleProperty('releaseSigningProperties')
        .getOrElse('.signing/signing.properties'))
def releaseSigning = new Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseSigningFile.isFile()) {
            throw new GradleException('缺少发布签名配置。请恢复 .signing 备份，详见 docs/signing_zh.md。')
        }
        ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
            if (!releaseSigning.getProperty(key)?.trim()) {
                throw new GradleException("发布签名配置缺少字段：${key}。")
            }
        }
        if (!rootProject.file(releaseSigning.getProperty('storeFile')).isFile()) {
            throw new GradleException('找不到发布密钥文件。请恢复原密钥，不要重新生成替代密钥。')
        }
        def certificate
        try {
            def keyStore = java.security.KeyStore.getInstance(releaseSigning.getProperty('storeType', 'PKCS12'))
            rootProject.file(releaseSigning.getProperty('storeFile')).withInputStream {
                keyStore.load(it, releaseSigning.getProperty('storePassword').toCharArray())
            }
            certificate = keyStore.getCertificate(releaseSigning.getProperty('keyAlias'))
            if (certificate == null || !keyStore.isKeyEntry(releaseSigning.getProperty('keyAlias'))) {
                throw new IllegalStateException('Missing signing entry')
            }
        } catch (Exception ignored) {
            throw new GradleException('无法读取发布证书，请检查密钥库、别名和密码。')
        }
        def fingerprint = java.security.MessageDigest.getInstance('SHA-256')
                .digest(certificate.encoded).encodeHex().toString()
        if (fingerprint != 'bad460b2b8d429c5091870c6f2dcc2f1f3d4cf1439acc70525c6ee0454b3469d') {
            throw new GradleException('发布证书与项目固定签名不一致，已停止构建。请恢复原发布密钥。')
        }
    }
}

android {
    namespace 're.zyg.fri.manager'
    compileSdk 35
    buildToolsVersion '35.0.1'
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 're.zyg.fri.manager'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DZFM_LIEF_SOURCE_DIR=${zfmLiefSourceDir}", '-DANDROID_STL=c++_static'
                targets 'zfm_elf'
            }
        }
    }

    signingConfigs {
        release {
            if (releaseSigningFile.isFile()) {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile', '.signing/release.p12'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
                storeType releaseSigning.getProperty('storeType', 'PKCS12')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (providers.gradleProperty('isolatedTestBuild').isPresent()) {
                applicationIdSuffix '.test'
                versionNameSuffix '-test'
                resValue 'string', 'app_name', 'ZygiskFrida 测试'
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            if (providers.gradleProperty('isolatedTestBuild').isPresent()) {
                applicationIdSuffix '.test'
                versionNameSuffix '-test'
                resValue 'string', 'app_name', 'ZygiskFrida 测试'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.6'
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.matching { it.name == 'preReleaseBuild' || it.name == 'validateSigningRelease' }.configureEach {
    dependsOn verifyReleaseSigning
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'org.tukaani:xz:1.10'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
